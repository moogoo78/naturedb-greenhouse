# envsubst template (nginx image): only ${NATUREDB_UPSTREAM} and ${NATUREDB_UPSTREAM_HOST} are replaced
server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's DNS, re-resolved so a recreated flask container (new IP) keeps working
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $naturedb ${NATUREDB_UPSTREAM};

    # naturedb, same-origin like the dev Vite proxy: no CORS, host-only login cookie.
    # naturedb picks its Site from the Host header, so send the site's host.
    location ~ ^/(api|admin|static|specimens)(/|$) {
        proxy_pass http://$naturedb;
        proxy_set_header Host ${NATUREDB_UPSTREAM_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 50m;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
