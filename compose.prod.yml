# prod: static build behind naturedb's Traefik (joins its network, routed by Host label).
# nginx proxies naturedb's paths to its flask container, so the client stays same-origin.
services:
  web:
    build:
      context: .
      target: prod
    environment:
      NATUREDB_UPSTREAM: ${NATUREDB_UPSTREAM:-naturedb-flask-prod-container:8001}
      NATUREDB_UPSTREAM_HOST: ${NATUREDB_UPSTREAM_HOST:-hast.biodiv.tw}
    expose:
      - 80
    restart: unless-stopped
    networks:
      - naturedb
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.greenhouse.rule=Host(`${GREENHOUSE_HOST:?set GREENHOUSE_HOST, e.g. begonia.naturedb.org}`)"
      - "traefik.http.routers.greenhouse.entrypoints=websecure"
      - "traefik.http.routers.greenhouse.tls.certresolver=myresolver"
      - "traefik.http.services.greenhouse.loadbalancer.server.port=80"

networks:
  naturedb:
    external: true
    name: ${NATUREDB_NETWORK:-naturedb_default}
