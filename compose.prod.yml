# prod: static build behind naturedb's Traefik (joins its network, routed by Host label)
services:
  web:
    build:
      context: .
      target: prod
      args:
        VITE_NATUREDB_BASE: ${VITE_NATUREDB_BASE:?set VITE_NATUREDB_BASE, e.g. https://hast.biodiv.tw}
    expose:
      - 80
    restart: unless-stopped
    networks:
      - naturedb
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.greenhouse.rule=Host(`${GREENHOUSE_HOST:?set GREENHOUSE_HOST, e.g. greenhouse.biodiv.tw}`)"
      - "traefik.http.routers.greenhouse.entrypoints=websecure"
      - "traefik.http.routers.greenhouse.tls.certresolver=myresolver"
      - "traefik.http.services.greenhouse.loadbalancer.server.port=80"

networks:
  naturedb:
    external: true
    name: ${NATUREDB_NETWORK:-naturedb_default}
