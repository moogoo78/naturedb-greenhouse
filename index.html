<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>溫室活體查詢</title>
    <script>
      // set the theme before first paint: ?theme= wins, then the saved choice
      (function () {
        var t = new URLSearchParams(location.search).get('theme');
        try { t = t || localStorage.getItem('naturedb-greenhouse:theme'); } catch (e) {}
        document.documentElement.dataset.theme = t === 'dads' ? 'dads' : 'classic';
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div class="app" x-data="greenhouse" x-cloak>
      <header class="topbar">
        <div>
          <h1 x-text="config.title"></h1>
          <p class="muted" x-text="collection ? `${config.subtitle} · ${collection.label}` : config.subtitle"></p>
        </div>
        <div class="user">
          <div class="segmented theme-switch" role="group" aria-label="介面">
            <button type="button" :class="{active: theme === 'classic'}" :aria-pressed="theme === 'classic'" @click="setTheme('classic')">原版</button>
            <button type="button" :class="{active: theme === 'dads'}" :aria-pressed="theme === 'dads'" @click="setTheme('dads')">DADS</button>
          </div>
          <span x-show="user" x-text="user && user.username"></span>
        </div>
      </header>

      <div class="alert error" x-show="error" x-text="error"></div>
      <div class="alert" x-show="notice" x-text="notice"></div>

      <div class="layout">
        <aside class="sidebar">
          <section class="facet source">
            <h3>資料來源</h3>
            <div class="segmented" role="group" aria-label="資料來源">
              <template x-for="s in sources" :key="s.key">
                <button type="button" :class="{active: source === s.key}" :aria-pressed="source === s.key"
                        @click="setSource(s.key)" x-text="s.label"></button>
              </template>
              <button type="button" :class="{active: source === 'all'}" :aria-pressed="source === 'all'"
                      @click="setSource('all')">全部</button>
            </div>
            <p class="hint" x-show="mixed" x-text="scopeHint"></p>
          </section>

          <form class="filters" @submit.prevent="submit">
            <label>
              <span>關鍵字</span>
              <input type="search" x-model="filters.q" placeholder="學名、採集號、採集者、備註" />
            </label>

            <label>
              <span>採集者</span>
              <select x-model="filters.collectorId" @change="submit">
                <option value="">全部</option>
                <template x-for="c in collectors" :key="c.value">
                  <option :value="c.value" x-text="`${c.label || c.value} (${c.count})`"></option>
                </template>
              </select>
            </label>

            <label>
              <span>採集號</span>
              <input type="search" x-model="filters.fieldNumber" placeholder="21299" />
            </label>

            <div class="field">
              <span>採集號範圍</span>
              <div class="range">
                <input type="text" inputmode="numeric" x-model="filters.fieldFrom" placeholder="從" />
                <span>–</span>
                <input type="text" inputmode="numeric" x-model="filters.fieldTo" placeholder="到" />
              </div>
            </div>

            <label x-show="hasLiving">
              <span>流水號 (QR)</span>
              <input type="text" inputmode="numeric" x-model="filters.catalogNumber" />
            </label>

            <label>
              <span x-text="config.taxonomy.groupLabel"></span>
              <select x-model="filters.sectionId" @change="pickSection">
                <option value="">全部</option>
                <template x-for="s in sections" :key="s.id">
                  <option :value="s.id" x-text="sectionName(s.id)"></option>
                </template>
              </select>
            </label>

            <div class="field">
              <span>學名 <small x-text="filters.sectionId ? `(sect. ${sectionName(filters.sectionId)})` : `(${config.taxonomy.family})`"></small></span>
              <template x-if="filters.taxon">
                <div class="chip">
                  <span x-html="filters.taxon.label"></span>
                  <small x-text="filters.taxon.rank"></small>
                  <button type="button" @click="clearTaxon" aria-label="clear">×</button>
                </div>
              </template>
              <template x-if="!filters.taxon">
                <div class="autocomplete">
                  <input type="search" x-model="taxonQuery" @input.debounce.300ms="searchTaxa"
                         placeholder="Begonia ..." @keydown.escape="taxonOptions = []" />
                  <ul x-show="taxonOptions.length" @click.outside="taxonOptions = []">
                    <template x-for="t in taxonOptions" :key="t.id">
                      <li @click="pickTaxon(t)">
                        <span x-html="taxonLabel(t)"></span>
                        <small x-text="t.rank"></small>
                      </li>
                    </template>
                  </ul>
                </div>
              </template>
            </div>

            <label>
              <span>地點</span>
              <input type="search" x-model="filters.locality" placeholder="霸王嶺、Juili" />
            </label>

            <label>
              <span>備註</span>
              <input type="search" x-model="filters.notes" />
            </label>

            <div class="actions">
              <button type="submit" class="primary">查詢</button>
              <button type="button" @click="reset">清除</button>
            </div>
          </form>

          <section class="facet" x-show="hasLiving">
            <h3>狀態</h3>
            <div class="segmented">
              <button type="button" :class="{active: !filters.status}" @click="filters.status = ''; submit()">全部</button>
              <template x-for="key in Object.keys(config.status)" :key="key">
                <button type="button" :class="{active: filters.status === key}"
                        @click="filters.status = filters.status === key ? '' : key; submit()">
                  <span x-text="config.status[key].label"></span>
                  <small x-text="statusCount(key)"></small>
                </button>
              </template>
            </div>
          </section>

          <template x-for="type in types" :key="type.id">
            <section class="facet" x-show="hasLiving">
              <h3 x-text="type.label || type.name"></h3>
              <ul>
                <template x-for="item in facetItems(type)" :key="item.value">
                  <li :class="{active: filters.annotations[type.id] === item.value, empty: !item.count}"
                      @click="toggleAnnotation(type, item.value)">
                    <span class="name" x-text="item.label"></span>
                    <span class="bar"><i :style="`width:${(item.count / facetMax(type)) * 100}%`"></i></span>
                    <span class="count" x-text="item.count"></span>
                  </li>
                </template>
              </ul>
            </section>
          </template>
        </aside>

        <main class="main">
          <div class="active-filters" x-show="activeFilters.length">
            <template x-for="a in activeFilters" :key="a.key">
              <span class="tag">
                <small x-text="a.label"></small>
                <span x-show="a.html" x-html="a.html ? a.value : ''"></span>
                <span x-show="!a.html" x-text="a.value"></span>
                <button type="button" @click="removeFilter(a.key)" :aria-label="`移除 ${a.label}`">×</button>
              </span>
            </template>
            <button type="button" class="clear-all" @click="reset">清除全部</button>
          </div>

          <div class="view-switch">
            <span>列表</span>
            <div class="segmented" role="group" aria-label="列表">
              <button type="button" :class="{active: view === 'unit'}" :aria-pressed="view === 'unit'"
                      @click="setView('unit')">標本</button>
              <button type="button" :class="{active: view === 'record'}" :aria-pressed="view === 'record'"
                      @click="setView('record')">採集號</button>
            </div>
          </div>

          <div class="stats" x-show="summary">
            <div x-show="rowsView === 'record'"><b x-text="total"></b><span>採集號 (records)</span></div>
            <template x-for="c in sourceCounts" :key="c.key">
              <div><b x-text="c.count"></b><span x-text="`${c.unit.label} (${c.unit.sub})`"></span></div>
            </template>
            <div><b x-text="summary && summary.taxa"></b><span>分類群</span></div>
            <div><b x-text="summary && summary.units_without_taxon"></b><span>未鑑定</span></div>
            <div class="export">
              <a :href="exportHref('xlsx')">匯出 Excel</a>
              <a :href="exportHref('csv')">CSV</a>
            </div>
          </div>

          <div class="table-wrap" :class="{loading}">
            <table>
              <thead>
                <tr>
                  <template x-for="col in columns" :key="col.label">
                    <th :class="{sortable: col.sort}" @click="setSort(col)">
                      <span x-text="colLabel(col)"></span> <small x-text="sortMark(col)"></small>
                    </th>
                  </template>
                </tr>
              </thead>
              <tbody>
                <template x-for="row in rows" :key="row.entity_key">
                  <tr>
                    <template x-for="(col, i) in columns" :key="col.label">
                      <td :class="col.className">
                        <template x-if="isLink(col)">
                          <span class="link-cell">
                            <a :href="recordUrl(row.entity_key)" target="_blank" rel="noopener" x-text="cell(col, row) || '—'"></a>
                            <template x-if="row.detail_path">
                              <a class="public-link" :href="publicUrl(row.detail_path)" target="_blank" rel="noopener"
                                 title="公開標本頁" aria-label="公開標本頁" x-html="externalIcon"></a>
                            </template>
                          </span>
                        </template>
                        <template x-if="!isLink(col) && col.units">
                          <div>
                            <small class="unit-counts" x-text="unitCounts(row)"></small>
                            <ul class="unit-chips">
                              <template x-for="u in row.units" :key="u.unit_id">
                                <li class="unit-chip" :class="{dead: isDead(u), preserved: !(unitSource(u) || {}).living}">
                                  <span class="basis-icon" x-show="basisBadge(u.basis_of_record).svg"
                                        :class="basisBadge(u.basis_of_record).className"
                                        :title="basisBadge(u.basis_of_record).title"
                                        x-html="basisBadge(u.basis_of_record).svg"></span>
                                  <template x-if="u.cover_image_url">
                                    <button type="button" class="thumb" @click="openImage(u, $el)"
                                            :aria-label="`影像 ${u.catalog_number || ''}`">
                                      <img :src="imageUrl(u, config.image.thumb)" alt="" loading="lazy" decoding="async" />
                                    </button>
                                  </template>
                                  <a :href="recordUrl(u.entity_key)" target="_blank" rel="noopener"
                                     :title="chipTitle(u)" x-text="chipLabel(u)"></a>
                                  <template x-if="u.detail_path">
                                    <a class="public-link" :href="publicUrl(u.detail_path)" target="_blank" rel="noopener"
                                       title="公開標本頁" aria-label="公開標本頁" x-html="externalIcon"></a>
                                  </template>
                                </li>
                              </template>
                            </ul>
                          </div>
                        </template>
                        <template x-if="!isLink(col) && col.image">
                          <span>
                            <template x-if="row.cover_image_url">
                              <button type="button" class="thumb" @click="openImage(row, $el)"
                                      :aria-label="`影像 ${row.catalog_number || ''}`">
                                <img :src="imageUrl(row, config.image.thumb)" alt="" loading="lazy" decoding="async" />
                              </button>
                            </template>
                          </span>
                        </template>
                        <template x-if="!isLink(col) && !!col.badge">
                          <span class="basis-badge" :class="badge(col, row).className"
                                :title="badge(col, row).title" role="img" :aria-label="badge(col, row).title">
                            <span x-show="badge(col, row).svg" x-html="badge(col, row).svg"></span>
                            <span x-show="!badge(col, row).svg" x-text="badge(col, row).label"></span>
                          </span>
                        </template>
                        <template x-if="!isLink(col) && !col.image && !col.units && !col.badge">
                          <span>
                            <template x-if="canFilter(col, row)">
                              <button type="button" class="cell-filter" :title="`篩選：${cell(col, row)}`"
                                      @click="applyCellFilter(col, row)">
                                <span x-show="!col.html" x-text="cell(col, row)"></span>
                                <span x-show="!!col.html" x-html="col.html ? col.html(row) : ''"></span>
                              </button>
                            </template>
                            <template x-if="!canFilter(col, row)">
                              <span>
                                <span x-show="!col.html" x-text="cell(col, row)"></span>
                                <span x-show="!!col.html" x-html="col.html ? col.html(row) : ''"></span>
                              </span>
                            </template>
                            <small class="sub" x-show="col.sub && col.sub(row)" x-text="col.sub && col.sub(row)"></small>
                          </span>
                        </template>
                      </td>
                    </template>
                  </tr>
                </template>
                <tr x-show="!loading && !rows.length">
                  <td :colspan="columns.length" class="empty-row">沒有資料</td>
                </tr>
              </tbody>
            </table>
          </div>

          <nav class="pager" x-show="total > config.pageSize">
            <button type="button" :disabled="page === 0" @click="search(page - 1)">‹ 上一頁</button>
            <span x-text="`${page + 1} / ${pages}`"></span>
            <button type="button" :disabled="page + 1 >= pages" @click="search(page + 1)">下一頁 ›</button>
          </nav>
        </main>
      </div>

      <div class="lightbox" x-show="preview" x-transition.opacity @click.self="closeImage"
           @keydown.escape.window="closeImage" role="dialog" aria-modal="true" aria-label="標本影像">
        <template x-if="preview">
          <figure>
            <button type="button" class="close" x-ref="previewClose" @click="closeImage" aria-label="關閉">×</button>
            <img :src="preview.src" :alt="preview.caption" />
            <figcaption>
              <span x-text="preview.caption"></span>
              <a :href="preview.full" target="_blank" rel="noopener">原始影像</a>
            </figcaption>
          </figure>
        </template>
      </div>
    </div>
  </body>
</html>
